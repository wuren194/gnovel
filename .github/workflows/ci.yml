name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-ci:
    name: macos-ci
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOVEL_LOG_MODE: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check public release contents
        run: python3 scripts/check_release_contents.py --public
      - name: Check contribution workflow logic
        run: node --test .github/scripts/cla.test.cjs
      - name: Run full local gate
        run: python3 scripts/local_ci.py --report-out "$RUNNER_TEMP/local-ci-report.json"
      # Reports and logs stay outside the checkout; never upload local Provider data.

  linux-ci:
    name: linux-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GOVEL_LOG_MODE: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check public release contents
        run: python3 scripts/check_release_contents.py --public
      - name: Run full local gate
        run: python3 scripts/local_ci.py --report-out "$RUNNER_TEMP/local-ci-report.json"
